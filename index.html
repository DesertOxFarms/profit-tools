<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2E6B3B"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Desert Ox Profit Tools</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"><style>/* Layout: sticky tab header over a single column of panels; wide screens go two-up for recipe and ranking cards. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8EDE7;
  --ink: #15201A;
  --ink-2: #55635A;
  --line: #D3DBD2;
  --accent: #2E6B3B;
  --accent-ink: #FFFFFF;
  --good: #1F7A3D;
  --bad: #B3321F;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1411; --surface: #171E19; --surface-2: #212A24; --ink: #E8EFE9; --ink-2: #9DAEA2;
    --line: #2B362E; --accent: #7CC48A; --accent-ink: #0E1A11; --good: #6FCB8A; --bad: #FF8A78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #171E19; --surface-2: #212A24; --ink: #E8EFE9; --ink-2: #9DAEA2;
  --line: #2B362E; --accent: #7CC48A; --accent-ink: #0E1A11; --good: #6FCB8A; --bad: #FF8A78;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  margin: 0; min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 24px; padding-top: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; padding-bottom: 8px; }
.brand-farm { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.brand-app { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; }
.tabs { display: flex; gap: 2px; min-width: 0; margin-left: -10px; }
.tabs a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 15px; padding: 10px 10px 11px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0 0 4px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--ink-2); margin: 0 0 16px; max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--ink-2); min-height: 18px; }
.hint.err { color: var(--bad); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { font: inherit; font-weight: 600; background: transparent; color: var(--ink-2); border: 0; padding: 10px; min-height: 44px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.big { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.big-label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 20px; margin-top: 16px; }
.kv div { min-width: 0; }
.kv dt, .k { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.kv dd, .v { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pos { color: var(--good); } .neg { color: var(--bad); }
table.cmp { width: 100%; border-collapse: collapse; margin-top: 18px; font-variant-numeric: tabular-nums; }
.cmp th, .cmp td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); font-size: 15px; }
.cmp th { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.cmp td:not(:first-child), .cmp th:not(:first-child) { text-align: right; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-weight: 600; font-size: 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } .big { font-size: 56px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card.off { background: transparent; }
.card.off .metrics { opacity: .55; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; font-weight: 600; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { flex: none; width: 42px; height: 24px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-2); transition: transform .15s, background .15s; }
.switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .sw::after { transform: translateX(18px); background: var(--accent-ink); }
.switch input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.rname { overflow-wrap: anywhere; }
.line { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.line b { color: var(--ink); font-weight: 600; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.metrics div { min-width: 0; }
.alone { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.warn { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.rank-no { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; color: var(--accent); min-width: 2ch; }
.rank-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rank-head h2 { margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 50px); z-index: 5; }
.pitem { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.pitem[hidden] { display: none; }
.pname { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.pgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.foot { font-size: 13px; color: var(--ink-2); max-width: 70ch; }
.empty { color: var(--ink-2); padding: 12px 0; }
.link { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 4px 0; align-self: flex-start; min-height: 32px; }
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
.two .big { font-size: 34px; overflow-wrap: normal; white-space: nowrap; }
@media (min-width: 760px) { .two .big { font-size: 46px; } }
.cbwrap { position: relative; }
.combo { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: min(300px, 45vh); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.combo[hidden] { display: none; }
.combo li { padding: 11px 12px; border-radius: 6px; cursor: pointer; }
.combo li:hover { background: var(--surface-2); }
.combo li.none { color: var(--ink-2); cursor: default; }

:root { --sky1:#FFE9B0; --sky2:#F7B26B; --sun:#FFF3C4; --hill1:#8DB27A; --hill2:#6C9A63; --field:#4F8A4B; --row:#3E7440; --barn:#6B3326; --hero-ink:#15201A; --gold:#E3A72F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky1:#15202B; --sky2:#6A4B3A; --sun:#F2C46B; --hill1:#1F3126; --hill2:#19281F; --field:#213A29; --row:#30503A; --barn:#0D1310; --hero-ink:#F1F5EF; } }
:root[data-theme="dark"] { --sky1:#15202B; --sky2:#6A4B3A; --sun:#F2C46B; --hill1:#1F3126; --hill2:#19281F; --field:#213A29; --row:#30503A; --barn:#0D1310; --hero-ink:#F1F5EF; }
.hero { position: relative; height: 190px; overflow: hidden; background: var(--sky1); padding-top: env(safe-area-inset-top, 0px); }
.hero-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-in { position: relative; display: flex; align-items: center; gap: 14px; padding-top: 26px; color: var(--hero-ink); }
.hero-text { display: flex; flex-direction: column; min-width: 0; }
.hero .brand-farm { color: var(--hero-ink); opacity: .85; }
.hero .brand-app { font-size: 38px; line-height: 1; }
.hero-sub { font-size: 14px; margin-top: 6px; max-width: 34ch; opacity: .9; position: relative; z-index: 1; }
.badge-logo { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #15201A; font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .02em; border: 3px solid var(--hero-ink); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.top .wrap { padding-top: 0; }
body::before { display: none; }
.top { top: env(safe-area-inset-top, 0px); }
body { background-image: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--accent) 5%, transparent) 22px 24px); background-attachment: fixed; }
@media (min-width: 760px) { .hero { height: 220px; } .hero .brand-app { font-size: 52px; } .badge-logo { width: 84px; height: 84px; font-size: 36px; } .hero-in { padding-top: 40px; gap: 20px; } }

img.badge-logo { background: #000; border: 0; padding: 0; object-fit: cover; box-shadow: 0 2px 12px rgba(0,0,0,.35); width: 84px; height: 84px; }
@media (min-width: 760px) { img.badge-logo { width: 112px; height: 112px; } }
.hero-in { padding-top: 22px; }

.hero { --hero-ink: #fff; background: linear-gradient(180deg, rgba(8,12,9,.66), rgba(8,12,9,.3)); }
.hero-art { display: none; }
.hero .brand-app, .hero .brand-farm, .hero-sub { text-shadow: 0 1px 8px rgba(0,0,0,.6); }

.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* Compact header so the Sales page fits on one phone screen */
.hero { height: 112px; }
.hero-in { padding-top: 12px; gap: 12px; }
img.badge-logo { width: 64px; height: 64px; }
.hero .brand-app { font-size: 30px; }
.hero .brand-farm { font-size: 12px; }
.hero-sub { font-size: 13px; margin-top: 3px; }
.tabs a { padding-top: 8px; padding-bottom: 9px; }
main { padding-block: 12px 28px; gap: 12px; }
.panel { padding: 14px; }
.lede { margin-bottom: 10px; }
.form { gap: 10px; }
.big { font-size: 40px; }
.kv { margin-top: 10px; }
table.cmp { margin-top: 10px; }
.cmp th, .cmp td { padding: 6px; }
.search { top: calc(env(safe-area-inset-top, 0px) + 44px); }
@media (min-width: 760px) { .hero { height: 130px; } .hero-in { padding-top: 16px; } img.badge-logo { width: 84px; height: 84px; } .hero .brand-app { font-size: 40px; } .big { font-size: 52px; } }

.form { grid-template-columns: 1fr 1fr; gap: 10px; }

      paybackWorst: worst > 0 ? prod.build / worst : null
    };
  }

  return { DATA:DATA, MONTHS:MONTHS, price:price, eff:eff, items:items, original:original,
           setOverrides:setOverrides, getOverrides:getOverrides, metrics:metrics, alone:alone, mix:mix };
}


(function(){
  var calc = makeCalc(DATA);
  var view = document.getElementById("view");
  var TABS = ["sales","productions","ranking","prices"];

  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  calc.setOverrides(store.get("dofp.prices.v1", {}));

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function money(n){ var r = Math.round(n); return (r < 0 ? "−" : "") + "$" + Math.abs(r).toLocaleString("en-US"); }
  function money2(n){
    var neg = n < 0, a = Math.abs(n);
    var s = a.toLocaleString("en-US", { minimumFractionDigits: (Math.abs(a - Math.round(a)) < 0.005 ? 0 : 2), maximumFractionDigits: 2 });
    return (neg ? "−" : "") + "$" + s;
  }
  function signed(n){ return '<span class="' + (n < 0 ? "neg" : "pos") + '">' + money(n) + "</span>"; }
  function mo(n){ if(n === null) return "Never"; return n >= 100 ? Math.round(n).toLocaleString("en-US") : n.toFixed(1); }
  function findItem(text){
    var t = (text || "").trim().toLowerCase();
    if(!t) return null;
    var all = calc.items();
    for(var i = 0; i < all.length; i++){ if(all[i].name.toLowerCase() === t) return all[i]; }
    return null;
  }
  function num(v){ var x = parseFloat(String(v).replace(/,/g,"")); return isFinite(x) ? x : 0; }

  /* ---------- Sales ---------- */
  function viewSales(){
    var st = store.get("dofp.sales", { item: "Corn", mode: "high", liters: 50000 });
    var names = calc.items().map(function(i){ return i.name; }).sort(function(a,b){ return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    view.innerHTML =
      '<section class="panel"><h1>Sales Calculator</h1>' +
      '<p class="lede">Pick an item, High or Low, and the liters. Prices are per 1,000 L.</p>' +
      '<div class="form">' +
      '<div class="field"><label for="s-item">Item</label><div class="cbwrap"><input id="s-item" role="combobox" aria-expanded="false" aria-controls="s-list" autocomplete="off" autocapitalize="words" placeholder="Tap to pick, or type like Corn" value="' + esc(st.item) + '">' +
      '<ul class="combo" id="s-list" role="listbox" hidden></ul></div><div class="hint" id="s-hint"></div></div>' +
      '<div class="field"><span class="label" id="s-mode-l">Price to use</span><div class="seg" role="group" aria-labelledby="s-mode-l">' +
      '<button type="button" data-mode="high">High</button><button type="button" data-mode="low">Low</button></div></div>' +
      '<div class="field"><label for="s-liters">Liters to sell</label><input id="s-liters" type="number" inputmode="decimal" min="0" step="any" value="' + esc(st.liters) + '"></div>' +
      '</div></section><section class="panel" id="s-out" aria-live="polite"></section>' +
      '';
    var itemEl = document.getElementById("s-item"), litEl = document.getElementById("s-liters"), out = document.getElementById("s-out"), hint = document.getElementById("s-hint");
    function update(){
      var it = findItem(itemEl.value), liters = Math.max(0, num(litEl.value));
      st.item = itemEl.value; st.liters = litEl.value; store.set("dofp.sales", st);
      view.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-mode") === st.mode ? "true" : "false"); });
      if(!it){
        hint.textContent = itemEl.value.trim() ? "That item is not on the list. Pick one from the suggestions." : "Choose an item to see the total.";
        hint.className = "hint" + (itemEl.value.trim() ? " err" : "");
        out.innerHTML = '<p class="empty">Pick an item to see the total.</p>'; return;
      }
      hint.textContent = ""; hint.className = "hint";
      var lowP = it.low || 0, highP = it.high || 0;
      var p = st.mode === "low" ? lowP : highP, m = st.mode === "low" ? it.lowMonth : it.highMonth;
      if(!p){
        out.innerHTML = '<p class="empty">' + esc(it.name) + ' has no ' + st.mode + ' price yet. Add one on the Prices tab.</p>'; return;
      }
      out.innerHTML =
        '<div class="big-label">Total for ' + liters.toLocaleString("en-US") + ' L of ' + esc(it.name) + ' at the ' + st.mode + ' price</div>' +
        '<div class="big">' + money2(liters / 1000 * p) + '</div>' +
        '<table class="cmp"><thead><tr><th></th><th>Low</th><th>High</th></tr></thead><tbody>' +
        '<tr><td>Price per 1,000 L</td><td>' + (lowP ? money(lowP) : "None") + '</td><td>' + (highP ? money(highP) : "None") + '</td></tr>' +
        '<tr><td>Total</td><td>' + (lowP ? money2(liters / 1000 * lowP) : "None") + '</td><td>' + (highP ? money2(liters / 1000 * highP) : "None") + '</td></tr>' +
        '<tr><td>Month</td><td>' + (it.lowMonth ? esc(it.lowMonth) : "None") + '</td><td>' + (it.highMonth ? esc(it.highMonth) : "None") + '</td></tr></tbody></table>';
    }
    view.querySelector(".seg").addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return; st.mode = b.getAttribute("data-mode"); update();
    });
    var listEl = document.getElementById("s-list"), prevItem = "";
    function showList(filter){
      var f = (filter || "").trim().toLowerCase();
      var m = names.filter(function(n){ return !f || n.toLowerCase().indexOf(f) >= 0; });
      listEl.innerHTML = m.length ? m.map(function(n){ return '<li role="option" data-n="' + esc(n) + '">' + esc(n) + '</li>'; }).join("") : '<li class="none">No match</li>';
      listEl.hidden = false; itemEl.setAttribute("aria-expanded", "true"); listEl.scrollTop = 0;
    }
    function hideList(){ listEl.hidden = true; itemEl.setAttribute("aria-expanded", "false"); }
    itemEl.addEventListener("focus", function(){ prevItem = itemEl.value; itemEl.value = ""; showList(""); });
    itemEl.addEventListener("blur", function(){ setTimeout(function(){ hideList(); if(!itemEl.value.trim()){ itemEl.value = prevItem; update(); } }, 150); });
    itemEl.addEventListener("input", function(){ showList(itemEl.value); });
    itemEl.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ var f = listEl.querySelector("li[data-n]"); if(f){ itemEl.value = f.getAttribute("data-n"); hideList(); update(); itemEl.blur(); } e.preventDefault(); }
      if(e.key === "Escape"){ itemEl.blur(); }
    });
    listEl.addEventListener("mousedown", function(e){ e.preventDefault(); });
    listEl.addEventListener("click", function(e){
      var li = e.target.closest("li[data-n]"); if(!li) return;
      itemEl.value = li.getAttribute("data-n"); hideList(); update(); itemEl.blur();
    });
    itemEl.addEventListener("input", update); litEl.addEventListener("input", update);
    update();
  }

  /* ---------- Productions ---------- */
  function viewProductions(){
    var st = store.get("dofp.prod", { name: DATA.productions[0].name });
    var runAll = store.get("dofp.running.v1", {});
    var prod = DATA.productions.filter(function(p){ return p.name === st.name; })[0] || DATA.productions[0];
    view.innerHTML =
      '<section class="panel"><h1>Production Calculator</h1>' +
      '<p class="lede">Switch recipes on or off. When more than one runs in the same production, they split its monthly cycles evenly.</p>' +
      '<div class="field"><label for="p-sel">Production</label><select id="p-sel">' +
      DATA.productions.map(function(p){ return '<option value="' + esc(p.name) + '"' + (p.name === prod.name ? " selected" : "") + '>' + esc(p.name) + '</option>'; }).join("") +
      '</select></div></section>' +
      '<section class="panel" id="p-sum" aria-live="polite"></section>' +
      '<div class="quick" id="p-quick"></div><div class="grid2" id="p-rec"></div>' +
      '<p class="foot">Best case sells at the high price while buying ingredients at the low price. Worst case is the reverse. Real months rarely line up that neatly, so what you make lands somewhere in between. Monthly running cost is a flat charge for each recipe that is switched on.</p>';
    function running(){
      var a = calc.alone(prod);
      var r = runAll[prod.name];
      if(!r){ r = {}; prod.recipes.forEach(function(x){ r[x.name] = (x.name === a.bestRow.rec.name); }); runAll[prod.name] = r; }
      return r;
    }
    function draw(){
      var r = running(), mx = calc.mix(prod, r), al = calc.alone(prod);
      store.set("dofp.running.v1", runAll); st.name = prod.name; store.set("dofp.prod", st);
      var sum = document.getElementById("p-sum");
      if(mx.n === 0){
        sum.innerHTML = '<h2>' + esc(prod.name) + '</h2><p class="empty">Build cost ' + money(prod.build) + '. Switch on at least one recipe to see the monthly numbers.</p>';
      } else {
        sum.innerHTML = '<h2>' + esc(prod.name) + '</h2>' +
          '<div class="two"><div><div class="big-label">Monthly profit, best case</div><div class="big ' + (mx.best < 0 ? "neg" : "pos") + '">' + money(mx.best) + '</div></div>' +
          '<div><div class="big-label">Monthly profit, worst case</div><div class="big ' + (mx.worst < 0 ? "neg" : "pos") + '">' + money(mx.worst) + '</div></div></div>' +
          '<dl class="kv"><div><dt>Build cost</dt><dd>' + money(prod.build) + '</dd></div>' +
          '<div><dt>Months to pay back, best</dt><dd>' + mo(mx.paybackBest) + '</dd></div>' +
          '<div><dt>Months to pay back, worst</dt><dd>' + mo(mx.paybackWorst) + '</dd></div>' +
          '<div><dt>Recipes running</dt><dd>' + mx.n + ' of ' + prod.recipes.length + '</dd></div></dl>' +
          (mx.missing ? '<p class="foot">A price is missing for something in a running recipe, so these numbers are low. Add it on the Prices tab.</p>' : "") +
          '<p class="alone" style="margin:14px 0 0">Best recipe alone: <b>' + esc(al.bestRow.rec.name) + '</b>, ' + money(al.bestRow.m.best) + ' a month, pays back in ' + mo(al.paybackBest) + ' months. ' +
          'Worst recipe alone: <b>' + esc(al.worstRow.rec.name) + '</b>, ' + money(al.worstRow.m.worst) + ' a month at worst prices.</p>';
      }
      function preset(q){
        var o = {};
        prod.recipes.forEach(function(x){ o[x.name] = q === "all" ? true : q === "none" ? false : q === "best" ? x.name === al.bestRow.rec.name : x.name === al.safeRow.rec.name; });
        return o;
      }
      function same(o){ return prod.recipes.every(function(x){ return !!o[x.name] === !!r[x.name]; }); }
      var qs = [["best","Best recipe only"],["safe","Safest recipe only"],["all","All on"],["none","All off"]];
      document.getElementById("p-quick").innerHTML = qs.map(function(q){
        return '<button class="btn" data-q="' + q[0] + '" type="button" aria-pressed="' + (same(preset(q[0])) ? "true" : "false") + '">' + q[1] + '</button>';
      }).join("");
      var active = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-rec");
      document.getElementById("p-rec").innerHTML = mx.rows.map(function(x, i){
        var rec = x.rec, a = al.rows[i].m, m = x.m;
        var uses = rec.ing.map(function(p){ return '<b>' + p[1].toLocaleString("en-US") + '</b> ' + esc(p[0]); }).join(", ");
        var makes = '<b>' + rec.outQty.toLocaleString("en-US") + '</b> ' + esc(rec.out) + (rec.by ? ' + <b>' + rec.byQty.toLocaleString("en-US") + '</b> ' + esc(rec.by) : "");
        return '<div class="card' + (x.on ? "" : " off") + '"><div class="card-head"><label class="switch"><input type="checkbox" data-rec="' + esc(rec.name) + '"' + (x.on ? " checked" : "") + '><span class="sw"></span><span class="rname">' + esc(rec.name) + '</span></label>' +
          (a.missing ? '<span class="badge warn">Missing price</span>' : "") + '</div>' +
          '<div class="line">Uses ' + uses + '<br>Makes ' + makes + ' per cycle</div>' +
          '<div class="metrics"><div><div class="k">Cycles a month</div><div class="v">' + (x.on ? (Math.round(m.c * 10) / 10).toLocaleString("en-US") : "Off") + ' <span class="alone">of ' + rec.maxCycles.toLocaleString("en-US") + '</span></div></div>' +
          '<div><div class="k">Running cost</div><div class="v">' + money(rec.run) + '</div></div>' +
          '<div><div class="k">Profit, best</div><div class="v">' + (x.on ? signed(m.best) : "—") + '</div></div>' +
          '<div><div class="k">Profit, worst</div><div class="v">' + (x.on ? signed(m.worst) : "—") + '</div></div></div>' +
          '<div class="alone">Alone at full cycles: ' + signed(a.best) + ' best, ' + signed(a.worst) + ' worst</div></div>';
      }).join("");
      if(active){ var el = document.querySelector('[data-rec="' + (window.CSS && CSS.escape ? CSS.escape(active) : active.replace(/"/g, '\\"')) + '"]'); if(el) el.focus(); }
    }
    document.getElementById("p-sel").addEventListener("change", function(e){
      prod = DATA.productions.filter(function(p){ return p.name === e.target.value; })[0]; draw();
    });
    view.addEventListener("change", function(e){
      var cb = e.target.closest && e.target.closest("[data-rec]");
      if(cb){ runAll[prod.name][cb.getAttribute("data-rec")] = cb.checked; draw(); }
    });
    view.addEventListener("click", function(e){
      var b = e.target.closest && e.target.closest("[data-q]"); if(!b) return;
      var q = b.getAttribute("data-q"), al = calc.alone(prod), r = {};
      prod.recipes.forEach(function(x){
        r[x.name] = q === "all" ? true : q === "none" ? false : q === "best" ? x.name === al.bestRow.rec.name : x.name === al.safeRow.rec.name;
      });
      runAll[prod.name] = r; draw();
    });
    draw();
  }

  /* ---------- Ranking ---------- */
  function viewRanking(){
    var rows = DATA.productions.map(function(p){ return { p: p, a: calc.alone(p) }; });
    rows.sort(function(x, y){
      var a = x.a.paybackBest, b = y.a.paybackBest;
      if(a === null && b === null) return 0; if(a === null) return 1; if(b === null) return -1; return a - b;
    });
    view.innerHTML = '<section class="panel"><h1>Ranking</h1><p class="lede">All ' + rows.length + ' productions, fastest payback first. Best case is the best recipe running alone at best-case prices. Worst case is the worst recipe running alone at worst-case prices.</p></section><div class="grid2">' +
      rows.map(function(x, i){
        var a = x.a;
        return '<div class="card"><div class="rank-head"><div class="rank-no">' + (i + 1) + '</div><div><h2>' + esc(x.p.name) + '</h2><div class="line">Build cost <b>' + money(x.p.build) + '</b></div></div></div>' +
          '<div class="two"><div><div class="k">Best case</div><div class="line"><b>' + esc(a.bestRow.rec.name) + '</b></div><div class="v">' + signed(a.bestRow.m.best) + ' a month</div><div class="alone">Pays back in ' + mo(a.paybackBest) + ' months</div></div>' +
          '<div><div class="k">Worst case</div><div class="line"><b>' + esc(a.worstRow.rec.name) + '</b></div><div class="v">' + signed(a.worstRow.m.worst) + ' a month</div><div class="alone">Pays back in ' + mo(a.paybackWorst) + ' months</div></div></div></div>';
      }).join("") + '</div><p class="foot">"Never" means that recipe loses money or breaks even at those prices. These follow the prices on the Prices tab, so edits there change the order.</p>';
  }

  /* ---------- Prices ---------- */
  function viewPrices(){
    var monthOpts = '<option value="">None</option>' + calc.MONTHS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join("");
    var list = calc.items().sort(function(a, b){ return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
    view.innerHTML = '<section class="panel"><h1>Prices</h1><p class="lede">Prices are per 1,000 liters. Change any number or month and every tab updates. Edits are saved on this device only.</p>' +
      '<div class="quick"><button class="btn" id="pr-reset" type="button">Reset all prices</button></div><div class="hint" id="pr-note"></div></section>' +
      '<div class="field search"><label for="pr-q" class="label">Search items</label><input id="pr-q" type="search" placeholder="Type to filter, like wood" autocomplete="off"></div>' +
      '<div class="grid2" id="pr-list">' + list.map(function(it, i){
        var o = calc.original(it.name);
        return '<div class="pitem" data-name="' + esc(it.name) + '"><div class="pname"><strong>' + esc(it.name) + '</strong><span class="badge">' + (it.kind === "raw" ? "Raw material" : "Product") + '</span><span class="badge" data-edited hidden>Edited</span></div>' +
          '<div class="pgrid">' +
          '<label>Low price<input type="number" inputmode="decimal" min="0" step="any" data-f="low" value="' + (it.low === null ? "" : it.low) + '"></label>' +
          '<label>Low month<select data-f="lowMonth">' + monthOpts.replace('value="' + it.lowMonth + '"', 'value="' + it.lowMonth + '" selected') + '</select></label>' +
          '<label>High price<input type="number" inputmode="decimal" min="0" step="any" data-f="high" value="' + (it.high === null ? "" : it.high) + '"></label>' +
          '<label>High month<select data-f="highMonth">' + monthOpts.replace('value="' + it.highMonth + '"', 'value="' + it.highMonth + '" selected') + '</select></label></div>' +
          '<button class="link" type="button" data-reset hidden>Reset this item</button></div>';
      }).join("") + '</div>';
    var box = document.getElementById("pr-list");
    function flag(card){
      var name = card.getAttribute("data-name"), ov = calc.getOverrides()[name], on = !!(ov && Object.keys(ov).length);
      card.querySelector("[data-edited]").hidden = !on; card.querySelector("[data-reset]").hidden = !on;
      var n = Object.keys(calc.getOverrides()).length;
      document.getElementById("pr-note").textContent = n ? n + " item" + (n === 1 ? "" : "s") + " changed from the original prices." : "";
    }
    box.querySelectorAll(".pitem").forEach(flag);
    box.addEventListener("input", save); box.addEventListener("change", save);
    function save(e){
      var el = e.target.closest("[data-f]"); if(!el) return;
      var card = el.closest(".pitem"), name = card.getAttribute("data-name"), f = el.getAttribute("data-f"), o = calc.original(name);
      var v = (f === "low" || f === "high") ? (el.value === "" ? null : num(el.value)) : el.value;
      var ov = calc.getOverrides(); ov[name] = ov[name] || {};
      if(v === o[f] || (v === "" && !o[f])) delete ov[name][f]; else ov[name][f] = v;
      if(!Object.keys(ov[name]).length) delete ov[name];
      calc.setOverrides(ov); store.set("dofp.prices.v1", ov); flag(card);
    }
    box.addEventListener("click", function(e){
      var b = e.target.closest("[data-reset]"); if(!b) return;
      var card = b.closest(".pitem"), name = card.getAttribute("data-name"), o = calc.original(name), ov = calc.getOverrides();
      delete ov[name]; calc.setOverrides(ov); store.set("dofp.prices.v1", ov);
      card.querySelector('[data-f="low"]').value = o.low === null ? "" : o.low; card.querySelector('[data-f="high"]').value = o.high === null ? "" : o.high;
      card.querySelector('[data-f="lowMonth"]').value = o.lowMonth; card.querySelector('[data-f="highMonth"]').value = o.highMonth; flag(card);
    });
    var armed = false, rb = document.getElementById("pr-reset");
    rb.addEventListener("click", function(){
      if(!armed){ armed = true; rb.textContent = "Tap again to reset every price"; rb.classList.add("primary"); return; }
      calc.setOverrides({}); store.set("dofp.prices.v1", {}); viewPrices();
    });
    document.getElementById("pr-q").addEventListener("input", function(e){
      var q = e.target.value.trim().toLowerCase();
      box.querySelectorAll(".pitem").forEach(function(c){ c.hidden = q && c.getAttribute("data-name").toLowerCase().indexOf(q) < 0; });
    });
  }

  /* ---------- Router ---------- */
  var VIEWS = { sales: viewSales, productions: viewProductions, ranking: viewRanking, prices: viewPrices };
  function route(){
    var h = (location.hash || "").replace("#", "");
    if(TABS.indexOf(h) < 0) h = "sales";
    document.querySelectorAll(".tabs a").forEach(function(a){
      if(a.getAttribute("data-tab") === h) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var fresh = view.cloneNode(false); view.parentNode.replaceChild(fresh, view); view = fresh;
    VIEWS[h]();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script><script>if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script></body></html>
